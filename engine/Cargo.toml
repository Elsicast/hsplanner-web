[package]
name = "HSPlanner"
version = "0.9.1" # inert: app version comes from package.json (see tauri.conf.json)
description = "HSPlanner"
authors = ["zium1337"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.31"
regex = "1.12.3"
once_cell = "1.21.4"

# Desktop (Tauri) build: IPC plugins + specta codegen.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Web-first build: tauri-build 已移除（它把 windows-sys 拖进 host 编译链，
# 在没有 MSVC/dlltool 的机器上无法构建 wasm）。如需恢复桌面版构建，
# 重新加回 tauri-build 并在 build.rs 调用 tauri_build::build()。
# build.rs 仅做数据 JSON 的编译期内嵌，wasm/host 都可用。

# Web build: the calc engine compiled to WebAssembly, driven by a Web Worker.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
